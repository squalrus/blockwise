# The app (app.tryspored.com) -- serves the Next.js frontend and the apps/api
# Express app (wrapped with serverless-http as a co-located Netlify Function
# — see apps/api/netlify/functions/api.ts), so /api/* calls stay same-origin.
# The marketing site (tryspored.com) is a separate Netlify site; see
# apps/marketing/netlify.toml.
#
# Dashboard: Package directory = apps/web, Functions directory =
# apps/api/netlify/functions (must match the `functions` path below).

[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"
  functions = "../api/netlify/functions"

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# BACKLOG.md Ref 89: public/ is served with default (long-lived) caching --
# without this, an already-installed client's browser could keep running a
# stale service-worker.js indefinitely instead of picking up updates.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

# BACKLOG.md Ref 102: event-reminders.ts is a scheduled (cron) function, the
# first one in this repo -- its cadence is declared via its own `config`
# export (Netlify Functions v2 convention) rather than a
# `[functions."event-reminders"]` block here.
